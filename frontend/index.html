  /* Force Indonesian on every page load */
  window.addEventListener('load', function () {
    setTimeout(function () {
      var select = document.querySelector('.goog-te-combo');
      if (select) {
        select.value = 'id';
        select.dispatchEvent(new Event('change'));
      }
    }, 800);
  });
</script>
